recipe_version: "2"
model: nvidia/GLM-5.3-Flash-NVFP4
model_revision: 423acf37583782c51c142d145aef733d72943d93
runtime: vllm
min_nodes: 4
container: localhost/gb10sor/vllm-glm53-flash-nvidia@sha256:27077a8feaf41041eae8e7c029dbddc99f38c77c6e8dd00905aca6618b6b7133
metadata:
  description: Qualified switched Quads TP4+EP profile, bounded to 32K service context.
defaults:
  port: 8000
  host: 127.0.0.1
  tensor_parallel: 4
  pipeline_parallel: 1
  served_model_name: nvidia/GLM-5.3-Flash-NVFP4
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  max_num_seqs: 4
  kv_cache_dtype: fp8
command: |
  vllm serve {model} --revision {model_revision} --host {host} --port {port} \
    --served-model-name {served_model_name} --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} --enable-expert-parallel --enable-ep-weight-filter \
    --reasoning-parser glm45 --attention-backend FLASHINFER_MLA_SPARSE_SM120 \
    --kv-cache-dtype {kv_cache_dtype} --enable-chunked-prefill --trust-remote-code
