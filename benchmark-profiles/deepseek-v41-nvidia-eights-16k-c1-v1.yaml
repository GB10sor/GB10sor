framework: llama-benchy
metadata:
  description: Local NVIDIA DeepSeek V4.1 TP8 bounded 16K/C1 qualification; no Arena upload.
args:
  depth: [0, 4096, 8192]
  pp: [2048]
  tg: [128]
  concurrency: [1]
  prefix_caching: true
  runs: 3
schedule:
  - {depth: 0, concurrency: 1}
  - {depth: 4096, concurrency: 1}
  - {depth: 8192, concurrency: 1}
