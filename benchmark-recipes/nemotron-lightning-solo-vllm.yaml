recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
model_revision: e8f3c7c4de75ad84fe1bcef95d38eca76214480b
runtime: vllm
min_nodes: 1
container: docker.io/vllm/vllm-openai@sha256:1c8e60a0841b333c700488cb029d3664807249da0c071e862191b00fe34b228c
metadata:
  description: Qualified GB10 Solo vLLM profile, bounded to 65K service context.
defaults:
  port: 8000
  host: 127.0.0.1
  tensor_parallel: 1
  pipeline_parallel: 1
  served_model_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  gpu_memory_utilization: 0.75
  max_model_len: 65536
  max_num_seqs: 4
  kv_cache_dtype: fp8
command: |
  vllm serve {model} --revision {model_revision} --host {host} --port {port} \
    --served-model-name {served_model_name} --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} --kv-cache-dtype {kv_cache_dtype} \
    --moe-backend marlin --enable-prefix-caching --mamba-backend flashinfer \
    --mamba-cache-mode align --reasoning-parser nemotron_v3 \
    --tool-call-parser qwen3_coder --enable-auto-tool-choice
