name: Verify deployment source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Verify
        run: ./VERIFY.command
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Evaluate every flake output
        run: nix flake show --all-systems --no-write-lock-file
